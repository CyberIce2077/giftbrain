default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: giftbrain_development

test:
  <<: *default
  database: giftbrain_test

production:
  primary:
    <<: *default
    database: giftbrain_production
    username: rails
    password: <%= ENV["GIFTBRAIN_DATABASE_PASSWORD"] %>
    host: db
