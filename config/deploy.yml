service: giftbrain
image: cyberice2077/giftbrain

servers:
  web:
    - ice-server@192.168.1.38

registry:
  username: cyberice2077
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    DB_HOST: 192.168.1.38
    RAILS_LOG_LEVEL: debug
    DB_USER: giftbrain
    DB_PASSWORD: ${GIFTBRAIN_DATABASE_PASSWORD}
    DB_NAME: giftbrain_production

proxy:
  ssl: true
  host: giftbrain.app

volumes:
  - "giftbrain_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"
